name: GIS Windows prototype build
on:
  workflow_dispatch:
  push:
    branches: [feature/gis-raster]
    paths:
      - 'GIS_Raster/**'
      - '.github/workflows/gis-windows-beta.yml'
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: GIS_Raster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: 'pip'
          cache-dependency-path: 'GIS_Raster/requirements.txt'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -p "test_*.py" -v
      - name: Compile prototype
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name COTA-NET-GIS --collect-all rasterio integrated_viewer.py
      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: COTA-NET-GIS-Windows-prototype
          path: GIS_Raster/dist/COTA-NET-GIS/
          retention-days: 14
